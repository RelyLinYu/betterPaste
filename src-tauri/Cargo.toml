[package]
name = "clipstack"
version = "0.1.0"
description = "Clipboard history manager for Windows"
authors = ["clipstack"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "clipstack_lib"
# Desktop-only build: `cdylib`/`staticlib` are for the mobile targets and would
# make the Windows linker export every public symbol (hitting the PE ordinal
# limit), so the lib is `rlib` only.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
# Tauri 2.x only — a bare "2" would also match 3.0.0-alpha pre-releases.
tauri = { version = "2.12.2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-opener = "2.7.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-log = "2.10.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
dirs = "6"
log = "0.4"

rusqlite = { version = "0.37", features = ["bundled"] }
arboard = { version = "3", features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[features]
# Tauri v2 default: custom-protocol is enabled by `tauri build`.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
